<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="echo-arch-title echo-arch-desc" font-family="'Hanken Grotesk', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title id="echo-arch-title">Echo: how it is built</title>
  <desc id="echo-arch-desc">Pi A makes a Wi-Fi signal and Pi B, a metre away, measures it: that one line is the sensor. Pi B sends its readings to the board, an Arduino UNO Q, which decides, seals every record in a hash chain and answers "What happened?" from the sealed records. Each Pi signs the record every 5 seconds with its own key. Screens are browsers on the kit's own Wi-Fi. Nothing reaches the internet, and there is no camera and no microphone.</desc>
  <defs>
    <marker id="echo-arch-head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#A3ABB6"/>
    </marker>
    <marker id="echo-arch-head-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#1FA5CF"/>
    </marker>
    <marker id="echo-arch-head-line" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#1FA5CF"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#101216"/>

  <!-- Heading -->
  <text x="60" y="76" font-size="48" font-weight="700" fill="#F2F4F6">Echo</text>
  <text x="196" y="76" font-size="28" fill="#A3ABB6">Architecture</text>

  <!-- The hard edge -->
  <rect x="40" y="120" width="1840" height="900" rx="10" fill="none" stroke="#F2F4F6" stroke-width="3"/>
  <rect x="600" y="98" width="720" height="44" fill="#101216"/>
  <text x="960" y="130" font-size="26" font-weight="700" fill="#F2F4F6" text-anchor="middle" letter-spacing="2">NO INTERNET · NO CAMERA · NO MICROPHONE</text>

  <!-- The board (its outline first, so the lines can end on the parts inside it) -->
  <rect x="620" y="440" width="680" height="512" rx="8" fill="#14171C" stroke="#F2F4F6" stroke-width="2"/>

  <!-- Connections (drawn before the boxes they join) -->
  <!-- The one sensing line -->
  <path d="M540 285 H1362" fill="none" stroke="#1FA5CF" stroke-width="7" marker-end="url(#echo-arch-head-line)"/>
  <!-- Ethernet cable, Pi A to the board -->
  <path d="M420 390 V470 Q420 480 430 480 H620" fill="none" stroke="#A3ABB6" stroke-width="2.5"/>
  <!-- Pi A signs the record -->
  <path d="M240 390 V726 Q240 736 250 736 H646" fill="none" stroke="#1FA5CF" stroke-width="3" marker-end="url(#echo-arch-head-accent)"/>
  <!-- Pi B sends its readings -->
  <path d="M1480 390 V594 Q1480 604 1470 604 H1274" fill="none" stroke="#A3ABB6" stroke-width="2.5" marker-end="url(#echo-arch-head)"/>
  <!-- Pi B signs the record -->
  <path d="M1660 390 V726 Q1660 736 1650 736 H1274" fill="none" stroke="#1FA5CF" stroke-width="3" marker-end="url(#echo-arch-head-accent)"/>
  <!-- Answers go to the screens -->
  <path d="M1268 868 H1374" fill="none" stroke="#A3ABB6" stroke-width="2.5" marker-end="url(#echo-arch-head)"/>

  <!-- Sensing line: the spot and its words -->
  <circle cx="960" cy="285" r="22" fill="#101216" stroke="#1FA5CF" stroke-width="5"/>
  <text x="960" y="226" font-size="32" font-weight="700" fill="#1FA5CF" text-anchor="middle">The one sensing line</text>
  <text x="960" y="352" font-size="24" fill="#F2F4F6" text-anchor="middle">A person standing here weakens the Wi-Fi signal.</text>
  <text x="960" y="384" font-size="19" fill="#A3ABB6" text-anchor="middle">5 GHz Wi-Fi · about a metre · one line, one spot</text>

  <!-- Pi A -->
  <rect x="100" y="180" width="440" height="210" rx="8" fill="#171A20" stroke="#3A404A" stroke-width="2"/>
  <text x="128" y="232" font-size="36" font-weight="700" fill="#F2F4F6">Pi A</text>
  <text x="128" y="270" font-size="24" fill="#F2F4F6">makes the Wi-Fi signal</text>
  <text x="128" y="300" font-size="19" fill="#A3ABB6">Raspberry Pi 5 · 5 GHz hotspot</text>
  <text x="128" y="344" font-size="22" font-weight="600" fill="#1FA5CF">signs the record with its own key</text>
  <text x="128" y="370" font-size="19" fill="#A3ABB6">Ed25519 · the key never leaves this Pi</text>

  <!-- Pi B -->
  <rect x="1380" y="180" width="440" height="210" rx="8" fill="#171A20" stroke="#3A404A" stroke-width="2"/>
  <text x="1408" y="232" font-size="36" font-weight="700" fill="#F2F4F6">Pi B</text>
  <text x="1408" y="270" font-size="24" fill="#F2F4F6">measures that signal</text>
  <text x="1408" y="300" font-size="19" fill="#A3ABB6">Raspberry Pi 5 · 25 readings a second</text>
  <text x="1408" y="344" font-size="22" font-weight="600" fill="#1FA5CF">signs the record with its own key</text>
  <text x="1408" y="370" font-size="19" fill="#A3ABB6">Ed25519 · the key never leaves this Pi</text>

  <!-- Connection words (beside their lines) -->
  <text x="436" y="512" font-size="19" fill="#A3ABB6">one Ethernet cable</text>
  <text x="258" y="596" font-size="22" font-weight="600" fill="#1FA5CF">signature</text>
  <text x="258" y="624" font-size="19" fill="#1FA5CF">every 5 s</text>
  <text x="1498" y="472" font-size="22" font-weight="600" fill="#F2F4F6">readings</text>
  <text x="1498" y="500" font-size="19" fill="#A3ABB6">25 a second</text>
  <text x="1678" y="596" font-size="22" font-weight="600" fill="#1FA5CF">signature</text>
  <text x="1678" y="624" font-size="19" fill="#1FA5CF">every 5 s</text>

  <!-- The board -->
  <text x="652" y="492" font-size="36" font-weight="700" fill="#F2F4F6">The board</text>
  <text x="1268" y="492" font-size="22" fill="#F2F4F6" text-anchor="end">everything runs here</text>
  <text x="652" y="524" font-size="19" fill="#A3ABB6">Arduino UNO Q · Qualcomm Dragonwing QRB2210</text>

  <rect x="652" y="548" width="616" height="112" rx="6" fill="#1B1F26" stroke="#3A404A" stroke-width="2"/>
  <text x="680" y="588" font-size="26" font-weight="700" fill="#F2F4F6">Decides</text>
  <text x="680" y="618" font-size="21" fill="#F2F4F6">someone there, still or moving, alerts, a device unplugged</text>
  <text x="680" y="644" font-size="18" fill="#A3ABB6">the brain · rules on one signal · no trained model</text>

  <rect x="652" y="680" width="616" height="112" rx="6" fill="#1B1F26" stroke="#1FA5CF" stroke-width="3"/>
  <text x="680" y="720" font-size="26" font-weight="700" fill="#1FA5CF">Seals every record</text>
  <text x="680" y="750" font-size="21" fill="#F2F4F6">each record carries the fingerprint of the one before</text>
  <text x="680" y="776" font-size="18" fill="#A3ABB6">hash chain · SHA-256 · one record a second</text>

  <rect x="652" y="812" width="616" height="112" rx="6" fill="#1B1F26" stroke="#3A404A" stroke-width="2"/>
  <text x="680" y="852" font-size="26" font-weight="700" fill="#F2F4F6">Answers “What happened?”</text>
  <text x="680" y="882" font-size="21" fill="#F2F4F6">in plain words, from the sealed records only</text>
  <text x="680" y="908" font-size="18" fill="#A3ABB6">Ask · a small language model only smooths the wording</text>

  <!-- What an attacker would have to break -->
  <rect x="100" y="792" width="440" height="160" rx="8" fill="#171A20" stroke="#E5484D" stroke-width="2.5"/>
  <text x="128" y="834" font-size="21" font-weight="700" fill="#E5484D">What an attacker would have to break</text>
  <text x="128" y="870" font-size="21" fill="#F2F4F6">every seal after the changed record,</text>
  <text x="128" y="898" font-size="21" fill="#F2F4F6">and two signing keys that never</text>
  <text x="128" y="926" font-size="21" fill="#F2F4F6">leave two other machines</text>

  <!-- Screens -->
  <rect x="1380" y="780" width="440" height="172" rx="8" fill="#171A20" stroke="#3A404A" stroke-width="2"/>
  <text x="1408" y="822" font-size="30" font-weight="700" fill="#F2F4F6">Screens</text>
  <text x="1408" y="848" font-size="19" fill="#A3ABB6">browsers on the kit's own Wi-Fi</text>
  <text x="1408" y="882" font-size="21" fill="#F2F4F6">the judge's page, with the 3D hall</text>
  <text x="1408" y="908" font-size="21" fill="#F2F4F6">the engine room</text>
  <text x="1408" y="934" font-size="21" fill="#F2F4F6">the alarm page, on a phone</text>

  <!-- Key -->
  <path d="M60 1050 H108" stroke="#1FA5CF" stroke-width="5"/>
  <text x="122" y="1057" font-size="19" fill="#A3ABB6">Echo's own idea: the sensing line, the seal, the signatures</text>
  <path d="M760 1050 H808" stroke="#A3ABB6" stroke-width="2.5"/>
  <text x="822" y="1057" font-size="19" fill="#A3ABB6">ordinary wiring and messages</text>
  <path d="M1180 1050 H1228" stroke="#E5484D" stroke-width="2.5"/>
  <text x="1242" y="1057" font-size="19" fill="#A3ABB6">what an attacker would have to break</text>
</svg>
