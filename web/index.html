    <style>
      html, body { margin: 0; height: 100%; background: #f4f0e6; color: #1c1b17; }
      /* The panels' rail: x 0-640. The room (web/src/room) fills the rest, so the two never overlap. */
      .shell-hud { position: fixed; top: 0; bottom: 0; left: 0; width: 640px; z-index: 1; }
      @media (max-width: 1100px) { .shell-hud { width: auto; right: 0; overflow: auto; } }
    </style>
  </head>

    <div id="room"></div>
    <main id="hud" class="shell-hud"></main>
