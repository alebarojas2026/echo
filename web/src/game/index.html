<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Can you hide from Wi-Fi?</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../room/room.css">
    <style>
      /* Colours and the two typefaces come from the shared tokens by way of room.css (AGENTS.md Style); each colour
         always has a word.
         Everything a player reads is at least 28 px (1.75rem). */
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 1.75rem/1.3 var(--font-text);
      }
      main {
        min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: clamp(1.5rem, 4vw, 5rem); align-items: center; padding: clamp(1.25rem, 4vw, 4.5rem);
      }
      @media (max-width: 1100px) { main { grid-template-columns: 1fr; align-items: start; } }
      .status { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; margin: 0 0 2rem; }
      .badge {
        padding: .15rem .75rem; border: 2px solid var(--edge); border-radius: .4rem;
        font-weight: 600; letter-spacing: .06em;
      }
      .status[data-kind='off'] .badge { color: var(--text-2); border-style: dashed; }
      .status[data-kind='fault'] .badge { color: var(--fault); border-color: var(--fault); }
      .status[data-kind='practice'] .badge { color: var(--text-2); }
      .cam { color: var(--text-2); }
      h1 { margin: 0; font-family: var(--font-title); font-size: clamp(3.5rem, 4.4vw, 5.25rem); font-weight: var(--title-weight); font-synthesis: none; line-height: 1.05; letter-spacing: -0.01em; text-wrap: balance; }
      .note { margin: 1rem 0 2.5rem; color: var(--text-2); min-height: 2.3rem; }
      .tally { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 0; }
      .count { padding: 1.25rem 1.5rem; background: var(--floor); border: 2px solid var(--edge); border-radius: .75rem; }
      .num { display: block; font-size: clamp(5rem, 9vw, 10rem); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
      .num[data-empty] { color: var(--text-2); }
      .what { display: block; margin-top: .5rem; color: var(--text-2); }
      .result { min-height: 4.6rem; margin: 1.75rem 0 0; font-size: 2.25rem; font-weight: 600; line-height: 1.25; text-wrap: balance; }
      .zone { color: var(--person); }
      h2 { margin: 0; font-size: 2.25rem; font-weight: 600; }
      .hint { margin: .25rem 0 1.25rem; color: var(--text-2); }
      .floor {
        display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; padding: .75rem;
        border: 2px solid var(--square); border-radius: .75rem;
      }
      .floor button {
        min-height: clamp(8rem, 20vh, 13rem); padding: 1.25rem 1.5rem; border: 2px solid var(--edge);
        border-radius: .5rem; background: var(--floor); color: inherit; font: inherit; text-align: left;
        cursor: pointer; touch-action: manipulation;
      }
      .floor button strong { display: block; font-size: 2.75rem; font-weight: 600; }
      .floor button span { color: var(--text-2); }
      .floor button:hover { border-color: var(--square); }
      .floor button:active { border-color: var(--person); transform: scale(.98); }
      .compass { display: flex; justify-content: space-between; margin: .5rem .25rem 0; color: var(--text-2); }
      .tools { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.5rem; }
      .tools button {
        min-height: 3.5rem; padding: .5rem 1.25rem; border: 2px solid var(--edge); border-radius: .5rem;
        background: transparent; color: var(--text); font: inherit; cursor: pointer;
      }
      .tools button:disabled { color: var(--text-2); cursor: default; }
      button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <p class="status" id="status" data-kind="off">
          <span class="badge" id="source" data-testid="game-source">NO DATA</span>
          <span class="cam" id="cam" data-testid="game-cam"></span>
        </p>
        <h1>Can you hide from Wi-Fi?</h1>
        <p class="note" id="note">Waiting for the board.</p>
        <div class="tally" data-testid="hide-tally" id="tally" aria-live="polite">
          <p class="count"><span class="num" id="found">__</span><span class="what">Wi-Fi found you</span></p>
          <p class="count"><span class="num" id="hidden">__</span><span class="what">You hid</span></p>
        </div>
        <p class="result" id="result" role="status"></p>
      </section>

      <section>
        <h2 id="floor-title">Where are they really standing?</h2>
        <p class="hint" id="hint">Tap the zone, or press 1 to 4.</p>
        <div class="floor" id="floor" role="group" aria-labelledby="floor-title">
          <button type="button" data-zone="1"><strong>Bed</strong><span>Zone 1, north-west</span></button>
          <button type="button" data-zone="2"><strong>Chair</strong><span>Zone 2, north-east</span></button>
          <button type="button" data-zone="3"><strong>Hall</strong><span>Zone 3, south-west</span></button>
          <button type="button" data-zone="4"><strong>Bathroom</strong><span>Zone 4, south-east</span></button>
        </div>
        <p class="compass" id="compass"><span>South: the router</span><span>North is up</span></p>
        <div class="tools">
          <button type="button" id="undo">Take back last round</button>
          <button type="button" id="reset">Start over</button>
        </div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
