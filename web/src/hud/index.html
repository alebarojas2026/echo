<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Echo</title>
    <link rel="icon" href="data:,">
  </head>
  <body class="hud-preview">
    <main id="hud"></main>
    <aside id="controls"></aside><script type="module">
      import { mountHudControls } from './controls.ts'
      import { loadHudProof } from './proof.ts'
      import { renderHud } from './index.ts'
      import { adaptHudState } from './state.ts'
      import { loadHudLayout } from './layout.ts'
      import { mockFeed } from './mock.ts'

      mountHudControls(document.querySelector('#controls'), detail => document.dispatchEvent(new CustomEvent('hud-command', { detail })))
      await loadHudLayout()
      const params = new URLSearchParams(location.search)
      const { state, proof } = mockFeed(params)
      const root = document.querySelector('#hud')
      renderHud(root, adaptHudState(state, proof))
      loadHudProof().then(proof => { if (proof) renderHud(root, adaptHudState(state, proof)) })
      if (params.has('pause')) {
        const receivedAt = Date.now()
        setTimeout(() => renderHud(root, adaptHudState(state, proof, receivedAt)), 1001)
      }
    </script>
  </body>
</html>
